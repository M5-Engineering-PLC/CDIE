# Discover recent public posts and commit feed and image copies for local delivery.
# main now requires pull requests, so this workflow opens or updates an automated
# PR branch instead of pushing directly to main.
name: Sync LinkedIn media

on:
  schedule:
    - cron: "27 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-linkedin
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.CMS_PUSH_TOKEN }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Save posts and images
        run: node scripts/sync-linkedin.mjs --optional
        env:
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_EMAIL }}
          GOOGLE_PRIVATE_KEY: ${{ secrets.GOOGLE_PRIVATE_KEY }}
      - name: Open pull request when content changed
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.CMS_PUSH_TOKEN }}
          add-paths: |
            content/linkedin-snapshot.json
            public/linkedin
          commit-message: Sync LinkedIn posts and local images
          committer: cdie-content-bot <41898282+github-actions[bot]@users.noreply.github.com>
          author: cdie-content-bot <41898282+github-actions[bot]@users.noreply.github.com>
          branch: bot/sync-linkedin-media
          delete-branch: true
          title: Sync LinkedIn posts and local images
          body: |
            Automated sync of LinkedIn snapshot data and downloaded local media.
