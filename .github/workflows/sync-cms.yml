# Keeps content/cms-snapshot.json in step with the dashboard's Google Sheet.
#
# The dashboard fires repository_dispatch "cms-updated" after every save
# (lib/admin/github.ts); the hourly schedule catches edits made directly in the
# sheet. A changed snapshot is committed to the default branch, which the host
# deploys like any other commit.
#
# Repository secrets: GOOGLE_SHEET_ID, GOOGLE_SERVICE_ACCOUNT_EMAIL,
# GOOGLE_PRIVATE_KEY, and CMS_PUSH_TOKEN. main is protected by a ruleset that
# repository admins bypass; CMS_PUSH_TOKEN is an admin's fine-grained token
# (this repository, Contents read and write), the same one the site holds as
# GITHUB_TOKEN, so the snapshot commit can land. scripts/connect-services.sh
# sets all four.
#
# 2026-09-25: until the Google secrets are set the job exits cleanly with a
# notice instead of failing every hour.

name: Sync dashboard content

on:
  repository_dispatch:
    types: [cms-updated]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-cms
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
      GOOGLE_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_EMAIL }}
      GOOGLE_PRIVATE_KEY: ${{ secrets.GOOGLE_PRIVATE_KEY }}
      CMS_PUSH_TOKEN: ${{ secrets.CMS_PUSH_TOKEN }}
    steps:
      - name: Check the secrets are set
        id: configured
        run: |
          if [ -z "$GOOGLE_SHEET_ID" ] || [ -z "$GOOGLE_SERVICE_ACCOUNT_EMAIL" ] || [ -z "$GOOGLE_PRIVATE_KEY" ] || [ -z "$CMS_PUSH_TOKEN" ]; then
            echo "::notice::Sync skipped: set the Google secrets and CMS_PUSH_TOKEN (scripts/connect-services.sh)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.configured.outputs.ready == 'true'
        with:
          token: ${{ secrets.CMS_PUSH_TOKEN }}

      - uses: actions/setup-node@v7
        if: steps.configured.outputs.ready == 'true'
        with:
          node-version: 24

      - name: Pull the sheet into the snapshot
        if: steps.configured.outputs.ready == 'true'
        run: node scripts/sync-cms.mjs

      - name: Commit when it changed
        if: steps.configured.outputs.ready == 'true'
        run: |
          git diff --quiet -- content/cms-snapshot.json && exit 0
          git config user.name "cdie-content-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/cms-snapshot.json
          git commit -m "Sync dashboard content from the Google Sheet"
          git push
