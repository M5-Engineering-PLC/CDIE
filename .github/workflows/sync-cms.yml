# Keeps content/cms-snapshot.json in step with the dashboard's Google Sheet.
#
# The dashboard fires repository_dispatch "cms-updated" after every save
# (lib/admin/github.ts); an hourly schedule, off for now, caught edits made
# directly in the sheet. A changed snapshot is committed to the default
# branch, which the host deploys like any other commit.
#
# Repository secrets: GOOGLE_SHEET_ID, GOOGLE_SERVICE_ACCOUNT_EMAIL, GOOGLE_PRIVATE_KEY.

name: Sync dashboard content

# 2026-09-25: the hourly schedule is off until the Google secrets are set.
on:
  repository_dispatch:
    types: [cms-updated]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-cms
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Pull the sheet into the snapshot
        run: node scripts/sync-cms.mjs
        env:
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_EMAIL }}
          GOOGLE_PRIVATE_KEY: ${{ secrets.GOOGLE_PRIVATE_KEY }}

      - name: Commit when it changed
        run: |
          git diff --quiet -- content/cms-snapshot.json && exit 0
          git config user.name "cdie-content-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/cms-snapshot.json
          git commit -m "Sync dashboard content from the Google Sheet"
          git push
