# Daily note 2026-09-25, "GitHub actions": the checks AGENTS.md asks for before
# work is handed back, run on every pull request and on main. `main` stays
# deployable because nothing merges red.
#
# No secrets are needed. Without LINKEDIN_SHEET_CSV_URL the build serves the
# stub feed, and without the Google values the dashboard reads the committed
# snapshot, which is exactly what a pull request preview should do.

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Route types
        run: npx next typegen

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
